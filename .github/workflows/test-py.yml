name: Test Python Client
on:
  pull_request:
    paths:
      - "packages/client-py/**"
      - "apps/server/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "spec/**"
      - "tests/**"
      - ".github/workflows/test-py.yml"
  push:
    branches: [main]
    paths:
      - "packages/client-py/**"
      - "apps/server/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "spec/**"
      - "tests/**"
      - ".github/workflows/test-py.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: pnpm/action-setup@v4
        with: {version: "11.0.0", run_install: false}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @discord-mock/web build
      - run: pnpm --filter @discord-mock/server build
      - run: uv sync --project packages/client-py
      - run: uv run --project packages/client-py ruff check packages/client-py
      - run: uv run --project packages/client-py ruff format --check packages/client-py
      - run: uv run --project packages/client-py pytest packages/client-py/tests
