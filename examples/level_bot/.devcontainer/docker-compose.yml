services:
  app:
    build:
      context: ../../..
      dockerfile: examples/dev-container-ts-bot/.devcontainer/Dockerfile
    volumes:
      - ../../..:/workspaces/discord-mock:cached
    working_dir: /workspaces/discord-mock
    environment:
      POSTGRES_HOSTNAME: db
    command: sleep infinity
  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
volumes:
  postgres-data:
