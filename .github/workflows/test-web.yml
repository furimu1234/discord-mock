name: Test Web and Mock Server
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "spec/**"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/test-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "spec/**"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/test-web.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @discord-mock/web test
      - run: pnpm --filter @discord-mock/server test
