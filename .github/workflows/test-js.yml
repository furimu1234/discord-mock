name: Test JavaScript Client
on:
  pull_request:
    paths: ["packages/client-js/**", "examples/level_bot/**", "apps/web/**", "apps/server/**", "spec/**", "tests/**", "package.json", "biome.json", "tsconfig.base.json", "tsconfig.tools.json", "scripts/**", "AGENTS.md", "CLAUDE.md", "GEMINI.md", ".github/copilot-instructions.md", ".cursor/rules/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", ".github/workflows/test-js.yml"]
  push:
    branches: [main]
    paths: ["packages/client-js/**", "examples/level_bot/**", "apps/web/**", "apps/server/**", "spec/**", "tests/**", "package.json", "biome.json", "tsconfig.base.json", "tsconfig.tools.json", "scripts/**", "AGENTS.md", "CLAUDE.md", "GEMINI.md", ".github/copilot-instructions.md", ".cursor/rules/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", ".github/workflows/test-js.yml"]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: pnpm/action-setup@v4
        with: {version: "11.0.0", run_install: false}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter dismock test
      - run: pnpm sample:test
